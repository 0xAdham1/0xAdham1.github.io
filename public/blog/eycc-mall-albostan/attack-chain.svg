<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1100" height="420" fill="#0f1117"/>
  <text x="550" y="36" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">Attack Chain — Mall Albostan</text>

  <!-- Row 1 -->
  <rect x="30" y="70" width="190" height="85" rx="10" fill="#e74c3c"/>
  <text x="125" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1. SQL Injection</text>
  <text x="125" y="120" text-anchor="middle" fill="white" font-size="11">UNION SELECT on</text>
  <text x="125" y="135" text-anchor="middle" fill="white" font-size="11">app_config → JWT secret</text>

  <rect x="260" y="70" width="190" height="85" rx="10" fill="#f39c12"/>
  <text x="355" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2. Forge JWT</text>
  <text x="355" y="120" text-anchor="middle" fill="white" font-size="11">Re-sign token,</text>
  <text x="355" y="135" text-anchor="middle" fill="white" font-size="11">role: user → admin</text>

  <rect x="490" y="70" width="190" height="85" rx="10" fill="#27ae60"/>
  <text x="585" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3. Upload Shell</text>
  <text x="585" y="120" text-anchor="middle" fill="white" font-size="11">.phtml bypass +</text>
  <text x="585" y="135" text-anchor="middle" fill="white" font-size="11">GIF magic-byte bypass</text>

  <rect x="720" y="70" width="190" height="85" rx="10" fill="#2980b9"/>
  <text x="815" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4. XXE</text>
  <text x="815" y="120" text-anchor="middle" fill="white" font-size="11">UTF-16 bypass, leak</text>
  <text x="815" y="135" text-anchor="middle" fill="white" font-size="11">uploads.db (base64)</text>

  <rect x="950" y="70" width="120" height="85" rx="10" fill="#8e44ad"/>
  <text x="1010" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5. UUID</text>
  <text x="1010" y="120" text-anchor="middle" fill="white" font-size="11">Recovered from</text>
  <text x="1010" y="135" text-anchor="middle" fill="white" font-size="11">uploads table</text>

  <!-- arrows row 1 -->
  <line x1="220" y1="112" x2="255" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="112" x2="485" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="112" x2="715" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="112" x2="945" y2="112" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down arrow from UUID box to row 2 -->
  <line x1="1010" y1="155" x2="1010" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="230" x2="960" y2="230" stroke="#555" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="710" y="255" width="200" height="85" rx="10" fill="#c0392b"/>
  <text x="810" y="285" text-anchor="middle" fill="white" font-size="14" font-weight="bold">6. Access Shell</text>
  <text x="810" y="305" text-anchor="middle" fill="white" font-size="11">Request /uploads/&lt;uuid&gt;.phtml</text>
  <text x="810" y="320" text-anchor="middle" fill="white" font-size="11">→ RCE via ?cmd=</text>

  <rect x="440" y="255" width="200" height="85" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="540" y="295" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold">🚩 Read Flag</text>

  <line x1="705" y1="298" x2="645" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="390" text-anchor="middle" fill="#888" font-size="12" font-style="italic">XXE can't list directories — it can only read known paths. Leaking uploads.db is the pivot that makes the shell findable.</text>
</svg>
