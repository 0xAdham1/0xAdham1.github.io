name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://0xadham1.github.io
          # Unused at runtime (static site, no backend) but env.ts validates them at build time.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          UPSTASH_REDIS_REST_URL: https://example.com
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          IP_ADDRESS_SALT: ci-dummy-salt
          BETTER_AUTH_SECRET: ci-dummy-secret-0123456789
        run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
